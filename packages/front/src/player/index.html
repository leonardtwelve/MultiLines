<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <title>Pixel Quests — Rejoindre</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d10;
        --bg-card: #161a1f;
        --border: #2a2f36;
        --fg: #e6e8eb;
        --fg-muted: #a0a4ab;
        --accent: #ffcc66;
        --danger: #dc2363;
        --ok: #66ddaa;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        font-family: 'Courier New', monospace;
        background: var(--bg);
        color: var(--fg);
        min-height: 100vh;
      }
      #app {
        max-width: 480px;
        margin: 0 auto;
        padding: 1.5rem 1.25rem;
      }
      /* Header */
      .join__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
      }
      .join__title {
        font-size: 1.5rem;
        margin: 0;
        color: var(--accent);
      }
      .join__status {
        font-size: 1.25rem;
        line-height: 1;
      }
      /* Form */
      .join__form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .join__field {
        display: flex;
        flex-direction: column;
        gap: .35rem;
      }
      .join__label {
        font-size: .85rem;
        color: var(--fg-muted);
        text-transform: uppercase;
        letter-spacing: .05em;
      }
      .join__field input {
        font-family: inherit;
        font-size: 1.1rem;
        padding: .9rem 1rem;
        background: var(--bg-card);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .join__field input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .join__submit {
        font-family: inherit;
        font-size: 1.1rem;
        font-weight: bold;
        padding: 1rem;
        background: var(--accent);
        color: var(--bg);
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        min-height: 48px;
      }
      .join__submit:disabled {
        opacity: .5;
        cursor: not-allowed;
      }
      .join__feedback {
        padding: .75rem 1rem;
        border-radius: 6px;
        font-size: .9rem;
        margin: 0;
      }
      .join__feedback[data-kind="info"] {
        background: rgba(255, 204, 102, .1);
        color: var(--accent);
      }
      .join__feedback[data-kind="error"] {
        background: rgba(220, 35, 99, .1);
        color: var(--danger);
      }
      /* Done state */
      .join__done {
        text-align: center;
        padding: 2rem 1rem;
        background: var(--bg-card);
        border: 1px solid var(--ok);
        border-radius: 12px;
        margin-top: 1rem;
      }
      .join__done-title {
        color: var(--ok);
        margin: 0 0 .75rem;
        font-size: 1.4rem;
      }
      .join__done-name { margin: 0 0 .5rem; font-size: 1rem; }
      .join__done-hint { margin: 0; color: var(--fg-muted); font-size: .85rem; }

      /* === BriefingScreen (slice 3d) === */
      .briefing__header { margin-bottom: 1.25rem; }
      .briefing__title { font-size: 1.5rem; margin: 0 0 .25rem; color: var(--accent); }
      .briefing__hint { margin: 0; color: var(--fg-muted); font-size: .9rem; }
      .briefing__body {
        display: flex; flex-direction: column; gap: 1.25rem;
        margin-bottom: 1.5rem;
      }
      .briefing__waiting {
        padding: 1.5rem;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        text-align: center;
        color: var(--fg-muted);
        font-style: italic;
      }
      .briefing__role,
      .briefing__objective,
      .briefing__capabilities,
      .briefing__dossiers {
        padding: 1rem;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .briefing__label {
        font-size: .75rem;
        text-transform: uppercase;
        letter-spacing: .05em;
        color: var(--fg-muted);
        margin-bottom: .5rem;
      }
      .briefing__value { font-size: 1.1rem; line-height: 1.4; }
      .briefing__hidden-hint {
        margin: .75rem 0 0;
        padding: .5rem .75rem;
        background: rgba(255, 204, 102, .12);
        color: var(--accent);
        border-radius: 4px;
        font-size: .85rem;
      }
      .briefing__capabilities ul,
      .briefing__dossiers ul {
        margin: 0; padding: 0;
        list-style: none;
        display: flex; flex-direction: column; gap: .25rem;
        font-family: 'Courier New', monospace;
      }
      .briefing__capabilities li, .briefing__dossiers li {
        padding: .35rem .5rem;
        background: var(--bg);
        border-radius: 4px;
        font-size: .9rem;
      }
      .briefing__ready {
        width: 100%;
        font-family: inherit;
        font-size: 1.1rem;
        font-weight: bold;
        padding: 1rem;
        background: var(--accent);
        color: var(--bg);
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        min-height: 48px;
      }
      .briefing__ready:disabled {
        opacity: .5;
        cursor: not-allowed;
      }
      .briefing__after-ready {
        text-align: center;
        padding: 1.25rem;
        background: var(--bg-card);
        border: 1px solid var(--ok);
        border-radius: 8px;
        color: var(--ok);
        margin: 0;
      }
      .briefing__error {
        padding: .75rem 1rem;
        background: rgba(220, 35, 99, .1);
        color: var(--danger);
        border-radius: 6px;
        font-size: .9rem;
        margin: 0 0 1rem;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
