<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <title>Pixel Quests — Rejoindre</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d10;
        --bg-card: #161a1f;
        --border: #2a2f36;
        --fg: #e6e8eb;
        --fg-muted: #a0a4ab;
        --accent: #ffcc66;
        --danger: #dc2363;
        --ok: #66ddaa;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        font-family: 'Courier New', monospace;
        background: var(--bg);
        color: var(--fg);
        min-height: 100vh;
      }
      #app {
        max-width: 480px;
        margin: 0 auto;
        padding: 1.5rem 1.25rem;
      }
      /* Header */
      .join__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
      }
      .join__title {
        font-size: 1.5rem;
        margin: 0;
        color: var(--accent);
      }
      .join__status {
        font-size: 1.25rem;
        line-height: 1;
      }
      /* Form */
      .join__form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .join__field {
        display: flex;
        flex-direction: column;
        gap: .35rem;
      }
      .join__label {
        font-size: .85rem;
        color: var(--fg-muted);
        text-transform: uppercase;
        letter-spacing: .05em;
      }
      .join__field input {
        font-family: inherit;
        font-size: 1.1rem;
        padding: .9rem 1rem;
        background: var(--bg-card);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .join__field input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .join__submit {
        font-family: inherit;
        font-size: 1.1rem;
        font-weight: bold;
        padding: 1rem;
        background: var(--accent);
        color: var(--bg);
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        min-height: 48px;
      }
      .join__submit:disabled {
        opacity: .5;
        cursor: not-allowed;
      }
      .join__feedback {
        padding: .75rem 1rem;
        border-radius: 6px;
        font-size: .9rem;
        margin: 0;
      }
      .join__feedback[data-kind="info"] {
        background: rgba(255, 204, 102, .1);
        color: var(--accent);
      }
      .join__feedback[data-kind="error"] {
        background: rgba(220, 35, 99, .1);
        color: var(--danger);
      }
      /* Done state */
      .join__done {
        text-align: center;
        padding: 2rem 1rem;
        background: var(--bg-card);
        border: 1px solid var(--ok);
        border-radius: 12px;
        margin-top: 1rem;
      }
      .join__done-title {
        color: var(--ok);
        margin: 0 0 .75rem;
        font-size: 1.4rem;
      }
      .join__done-name { margin: 0 0 .5rem; font-size: 1rem; }
      .join__done-hint { margin: 0; color: var(--fg-muted); font-size: .85rem; }

      /* === BriefingScreen (slice 3d) === */
      .briefing__header { margin-bottom: 1.25rem; }
      .briefing__title { font-size: 1.5rem; margin: 0 0 .25rem; color: var(--accent); }
      .briefing__hint { margin: 0; color: var(--fg-muted); font-size: .9rem; }
      .briefing__body {
        display: flex; flex-direction: column; gap: 1.25rem;
        margin-bottom: 1.5rem;
      }
      .briefing__waiting {
        padding: 1.5rem;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        text-align: center;
        color: var(--fg-muted);
        font-style: italic;
      }
      .briefing__role,
      .briefing__objective,
      .briefing__capabilities,
      .briefing__dossiers {
        padding: 1rem;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .briefing__label {
        font-size: .75rem;
        text-transform: uppercase;
        letter-spacing: .05em;
        color: var(--fg-muted);
        margin-bottom: .5rem;
      }
      .briefing__value { font-size: 1.1rem; line-height: 1.4; }
      .briefing__hidden-hint {
        margin: .75rem 0 0;
        padding: .5rem .75rem;
        background: rgba(255, 204, 102, .12);
        color: var(--accent);
        border-radius: 4px;
        font-size: .85rem;
      }
      .briefing__capabilities ul,
      .briefing__dossiers ul {
        margin: 0; padding: 0;
        list-style: none;
        display: flex; flex-direction: column; gap: .25rem;
        font-family: 'Courier New', monospace;
      }
      .briefing__capabilities li, .briefing__dossiers li {
        padding: .35rem .5rem;
        background: var(--bg);
        border-radius: 4px;
        font-size: .9rem;
      }
      .briefing__ready {
        width: 100%;
        font-family: inherit;
        font-size: 1.1rem;
        font-weight: bold;
        padding: 1rem;
        background: var(--accent);
        color: var(--bg);
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        min-height: 48px;
      }
      .briefing__ready:disabled {
        opacity: .5;
        cursor: not-allowed;
      }
      .briefing__after-ready {
        text-align: center;
        padding: 1.25rem;
        background: var(--bg-card);
        border: 1px solid var(--ok);
        border-radius: 8px;
        color: var(--ok);
        margin: 0;
      }
      .briefing__error {
        padding: .75rem 1rem;
        background: rgba(220, 35, 99, .1);
        color: var(--danger);
        border-radius: 6px;
        font-size: .9rem;
        margin: 0 0 1rem;
      }

      /* === CassePlayScreen (slice 3e-3) === */
      .casse { display: flex; flex-direction: column; gap: 1rem; }
      .casse__header {
        display: flex; align-items: center; justify-content: space-between;
        gap: 1rem;
        padding: .75rem 1rem;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .casse__turn { display: flex; flex-direction: column; align-items: flex-start; }
      .casse__turn-label {
        font-size: .65rem;
        text-transform: uppercase;
        letter-spacing: .1em;
        color: var(--fg-muted);
      }
      .casse__turn-number {
        font-size: 1.5rem;
        font-weight: bold;
        color: var(--accent);
        line-height: 1.1;
      }
      .casse__alert {
        flex: 1;
        display: flex; flex-direction: column; gap: .25rem;
        align-items: flex-end;
      }
      .casse__alert-label {
        font-size: .65rem;
        text-transform: uppercase;
        letter-spacing: .1em;
        color: var(--fg-muted);
      }
      .casse__alert-bar {
        width: 100%;
        height: 6px;
        background: var(--bg);
        border-radius: 3px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .casse__alert-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--ok) 0%, var(--accent) 50%, var(--danger) 100%);
        transition: width .3s ease;
      }
      .casse__alert-value {
        font-size: .8rem;
        font-family: 'Courier New', monospace;
        color: var(--fg-muted);
      }
      .casse__active {
        padding: 1rem;
        background: rgba(102, 221, 170, .12);
        border: 1px solid var(--ok);
        border-radius: 8px;
        text-align: center;
      }
      .casse__active-badge {
        display: inline-block;
        padding: .35rem .85rem;
        background: var(--ok);
        color: var(--bg);
        font-size: .85rem;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: .1em;
        border-radius: 4px;
        margin-bottom: .5rem;
      }
      .casse__active-hint {
        margin: 0;
        font-size: .9rem;
        color: var(--fg-muted);
      }
      .casse__waiting-block {
        padding: 1.5rem;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        text-align: center;
        color: var(--fg-muted);
        font-style: italic;
      }
      .casse__waiting-block strong {
        color: var(--accent);
        font-style: normal;
      }
      .casse__actions {
        display: flex; flex-direction: column; gap: .75rem;
      }
      .casse__action {
        text-align: left;
        font-family: inherit;
        padding: 1rem;
        background: var(--bg-card);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
        display: flex; flex-direction: column; gap: .35rem;
        min-height: 88px;
        transition: border-color .15s ease;
      }
      .casse__action:not(:disabled):hover {
        border-color: var(--accent);
      }
      .casse__action:not(:disabled):active {
        background: var(--bg);
      }
      .casse__action:disabled {
        opacity: .5;
        cursor: wait;
      }
      .casse__action--low { border-left: 4px solid var(--ok); }
      .casse__action--medium { border-left: 4px solid var(--accent); }
      .casse__action--high { border-left: 4px solid var(--danger); }
      .casse__action-label {
        font-size: 1.05rem;
        font-weight: bold;
      }
      .casse__action-risk {
        font-size: .7rem;
        text-transform: uppercase;
        letter-spacing: .1em;
        color: var(--fg-muted);
      }
      .casse__action-desc {
        font-size: .85rem;
        color: var(--fg-muted);
        line-height: 1.35;
      }
      .casse__resolved {
        padding: .75rem 1rem;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: .9rem;
      }
      .casse__resolved[data-success="true"] { border-color: var(--ok); }
      .casse__resolved[data-success="false"] { border-color: var(--danger); }
      .casse__resolved em { color: var(--accent); font-style: normal; }
      .casse__error {
        padding: .75rem 1rem;
        background: rgba(220, 35, 99, .1);
        color: var(--danger);
        border-radius: 6px;
        font-size: .9rem;
      }
      .casse__waiting {
        text-align: center;
        color: var(--fg-muted);
        padding: 2rem;
      }

      /* === EndedScreen (slice 3e-3b) === */
      .ended {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 70vh;
        padding: 1rem;
      }
      .ended__card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 2rem 1.5rem;
        text-align: center;
        max-width: 380px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .ended__emoji {
        font-size: 4rem;
        line-height: 1;
        margin-bottom: .5rem;
      }
      .ended__title {
        margin: 0;
        font-size: 1.4rem;
        color: var(--accent);
        line-height: 1.2;
      }
      .ended__subtitle {
        margin: 0;
        font-size: .95rem;
        color: var(--fg-muted);
        line-height: 1.4;
      }
      .ended__stats {
        margin-top: .5rem;
        padding: 1rem;
        background: var(--bg);
        border-radius: 8px;
        display: flex;
        justify-content: center;
        gap: 1.5rem;
      }
      .ended__stat {
        display: flex;
        flex-direction: column;
        gap: .25rem;
      }
      .ended__stat-label {
        font-size: .7rem;
        text-transform: uppercase;
        letter-spacing: .1em;
        color: var(--fg-muted);
      }
      .ended__stat-value {
        font-size: 1.6rem;
        font-weight: bold;
        color: var(--accent);
        font-family: 'Courier New', monospace;
      }
      .ended__replay {
        margin-top: .75rem;
        font-family: inherit;
        font-size: 1rem;
        font-weight: bold;
        padding: .9rem 1.5rem;
        background: var(--accent);
        color: var(--bg);
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        min-height: 48px;
      }
      .ended__replay:active {
        opacity: .85;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
